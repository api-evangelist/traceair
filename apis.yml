aid: traceair
name: TraceAir
description: TraceAir is a construction site intelligence platform for homebuilders
  and land developers, combining drone photogrammetry and LiDAR scans with cloud analytics
  to track sitework progress, verify earthwork cut/fill quantities, generate lot layouts
  and yield estimates, and document builds with 360-degree interior scans across the
  full project lifecycle from land acquisition to handover. The company publishes
  no public developer portal, API documentation, or SDKs; the platform is accessed
  through its web application.
